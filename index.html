<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Equity Hub | Secure Server</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --deep-gold: #996515;
            --white-glass: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(153, 101, 21, 0.15);
            --bg-color: #f4f4f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-color); min-height: 100vh; padding-bottom: 90px; }
        .hidden { display: none !important; }
        .app-container { max-width: 450px; margin: 0 auto; padding: 20px; }

        .glass-card {
            background: var(--white-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--deep-gold), #D4AF37);
            color: white; border: none; padding: 16px; border-radius: 18px;
            font-weight: 800; width: 100%; cursor: pointer; margin-top: 10px;
        }

        .glass-input {
            width: 100%; background: #fff; border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 14px; margin-bottom: 12px; outline: none;
        }
        
        .nav-item { color: #aaa; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--deep-gold); }
    </style>
</head>
<body>

<div class="app-container">
    <section id="auth-screen" style="padding-top: 60px;">
        <div class="glass-card" style="text-align: center;">
            <h1 style="color: var(--deep-gold); font-weight: 900; font-size: 1.8rem;">EQUITY HUB</h1>
            <p style="font-size: 0.7rem; opacity: 0.5; margin-bottom: 30px;">ENCRYPTED ACCESS</p>
            
            <div id="reg-form">
                <input type="text" id="reg-name" class="glass-input" placeholder="Full Name">
                <input type="text" id="reg-matric" class="glass-input" placeholder="Matric No (Unique ID)">
                <input type="email" id="reg-email" class="glass-input" placeholder="Email Address">
                <input type="password" id="reg-pin" class="glass-input" placeholder="Set 4-Digit Secret PIN" maxlength="4">
                <button class="btn-gold" onclick="handleSecureAuth()">Enter Server</button>
                <p onclick="gate()" style="margin-top:20px; font-size:0.7rem; color:var(--deep-gold); cursor:pointer; font-weight:700;">EXECUTIVE ACCESS</p>
            </div>
        </div>
    </section>

    <main id="main-app" class="hidden">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2 style="font-weight: 800;">Class Feed</h2>
            <img id="u-pfp-top" src="" style="width: 40px; height: 40px; border-radius: 12px;">
        </header>

        <div id="feed-display"></div>

        <section id="tab-profile" class="hidden">
            <div class="glass-card" style="text-align: center;">
                <img id="p-img" src="" style="width: 80px; border-radius: 20px; margin-bottom: 15px;">
                <h3 id="p-name">---</h3>
                <p id="p-role" style="color:var(--deep-gold); font-weight:700; font-size: 0.8rem;"></p>
                <button class="btn-gold" style="background:#ff4757; margin-top:20px;" onclick="logout()">Disconnect</button>
            </div>
        </section>

        <nav class="bottom-nav" style="position:fixed; bottom:0; left:0; right:0; background:white; display:flex; justify-content:space-around; padding:20px; border-top:1px solid #eee;">
            <div class="nav-item active" onclick="switchTab('feed')"><i data-lucide="home"></i></div>
            <div class="nav-item" onclick="switchTab('profile')"><i data-lucide="user"></i></div>
        </nav>
    </main>
</div>

<script>
    // Config as per your previous setup
    const firebaseConfig = {
        apiKey: "AIzaSyBLrdBzHOhsJW4_ixghTx96XpHT4QMS8s8",
        authDomain: "executo-4ecd7.firebaseapp.com",
        projectId: "executo-4ecd7",
        storageBucket: "executo-4ecd7.firebasestorage.app",
        messagingSenderId: "738758706005",
        appId: "1:738758706005:web:383f547ce4ddb8b243e5dc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let user = JSON.parse(localStorage.getItem('equity_secure_v1'));

    window.onload = () => { if(user) showMainApp(); lucide.createIcons(); };

    // SECURE AUTHENTICATION SERVER LOGIC
    async function handleSecureAuth() {
        const name = document.getElementById('reg-name').value.trim();
        const matric = document.getElementById('reg-matric').value.trim().toUpperCase();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const pin = document.getElementById('reg-pin').value;

        if(!name || !matric || !email || !pin) return alert("All fields are required for encryption.");

        const userRef = db.collection("users").doc(matric.replace(/\//g, '_'));
        const doc = await userRef.get();

        if (doc.exists) {
            // LOGIN MODE: Check PIN
            const data = doc.data();
            if (data.pin === pin) {
                loginSuccess(data);
            } else {
                alert("Security Error: Identity match failed or incorrect PIN.");
            }
        } else {
            // REGISTRATION MODE: Check if Email is unique
            const emailCheck = await db.collection("users").where("email", "==", email).get();
            if (!emailCheck.empty) return alert("Email already linked to another identity.");

            const newUser = { name, matric, email, pin, role: "Student", pic: `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}` };
            await userRef.set(newUser);
            loginSuccess(newUser);
        }
    }

    function loginSuccess(userData) {
        user = userData;
        localStorage.setItem('equity_secure_v1', JSON.stringify(user));
        showMainApp();
    }

    function showMainApp() {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('u-pfp-top').src = user.pic;
        loadFeed();
    }

    function loadFeed() {
        db.collection("posts").orderBy("time", "desc").onSnapshot(snap => {
            const cont = document.getElementById('feed-display');
            cont.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                cont.innerHTML += `
                    <div class="glass-card">
                        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                            <img src="${d.pic}" style="width:30px; border-radius:50%;">
                            <h4 style="font-size:0.75rem;">${d.name} <span style="color:var(--deep-gold); font-size:0.6rem;">(${d.role})</span></h4>
                        </div>
                        <p style="font-size:0.85rem; line-height:1.4;">${d.txt}</p>
                    </div>`;
            });
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
    function switchTab(t) { /* standard tab logic */ }
</script>
</body>
</html>
