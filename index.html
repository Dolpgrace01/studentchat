<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Equity Hub | Secure Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --deep-gold: #996515;
            --bright-gold: #D4AF37;
            --white-glass: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(153, 101, 21, 0.15);
            --bg-color: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); min-height: 100vh; padding-bottom: 90px; }
        .hidden { display: none !important; }
        .app-container { max-width: 480px; margin: 0 auto; padding: 20px; }

        .glass-card {
            background: var(--white-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--deep-gold), var(--bright-gold));
            color: white; border: none; padding: 16px; border-radius: 20px;
            font-weight: 800; width: 100%; cursor: pointer;
        }

        .glass-input {
            width: 100%; background: white; border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px; margin-bottom: 12px; outline: none;
        }

        .poll-option {
            background: rgba(153, 101, 21, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 12px; margin-top: 8px;
            display: flex; justify-content: space-between; cursor: pointer;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 85px;
            background: rgba(255, 255, 255, 0.8); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center; padding-bottom: 20px;
        }

        .nav-item { color: #aaa; cursor: pointer; }
        .nav-item.active { color: var(--deep-gold); }
    </style>
</head>
<body>

<div class="app-container">
    <section id="auth-screen" style="padding-top: 80px;">
        <div class="glass-card" style="text-align: center;">
            <h1 style="font-weight: 900; color: var(--deep-gold);">EQUITY HUB</h1>
            <p style="font-size: 0.7rem; opacity: 0.5; margin-bottom: 30px;">SECURE CLASS PORTAL</p>
            
            <div id="auth-ui">
                <button class="btn-gold" onclick="showForm()">Register / Login</button>
                <button onclick="gate()" style="background:transparent; border:none; color:var(--deep-gold); margin-top:20px; font-weight:700;">Executive Portal</button>
            </div>

            <div id="reg-form" class="hidden">
                <input type="text" id="reg-name" class="glass-input" placeholder="Full Name">
                <input type="text" id="reg-matric" class="glass-input" placeholder="Matric No (2026/xxx)">
                <input type="email" id="reg-email" class="glass-input" placeholder="Email Address">
                <button class="btn-gold" onclick="handleAuth()">Enter Hub</button>
            </div>
        </div>
    </section>

    <main id="main-app" class="hidden">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="view-title">Feed</h2>
            <img id="u-pfp-top" src="" style="width: 40px; height: 40px; border-radius: 12px;">
        </header>

        <div id="poll-display"></div>

        <section id="tab-feed">
            <div id="feed-display"></div>
        </section>

        <section id="tab-profile" class="hidden">
            <div class="glass-card" style="text-align: center;">
                <img id="p-img" src="" style="width: 80px; border-radius: 20px;">
                <h3 id="p-name">---</h3>
                <p id="p-role" style="color:var(--deep-gold); font-weight:700;"></p>
            </div>

            <div id="exec-tools" class="glass-card hidden">
                <p style="font-weight:800; color:var(--deep-gold); margin-bottom:15px;">CREATE POLL</p>
                <input type="text" id="poll-q" class="glass-input" placeholder="Question">
                <input type="text" id="poll-o1" class="glass-input" placeholder="Option 1">
                <input type="text" id="poll-o2" class="glass-input" placeholder="Option 2">
                <button class="btn-gold" onclick="createPoll()">Launch Poll</button>
            </div>

            <button class="btn-gold" style="background:#ff4757; margin-top:10px;" onclick="logout()">Logout</button>
        </section>
    </main>

    <nav class="bottom-nav hidden" id="main-nav">
        <div class="nav-item active" onclick="switchTab('feed')"><i data-lucide="home"></i></div>
        <div class="nav-item" onclick="switchTab('profile')"><i data-lucide="user"></i></div>
    </nav>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBLrdBzHOhsJW4_ixghTx96XpHT4QMS8s8",
        authDomain: "executo-4ecd7.firebaseapp.com",
        projectId: "executo-4ecd7",
        storageBucket: "executo-4ecd7.firebasestorage.app",
        messagingSenderId: "738758706005",
        appId: "1:738758706005:web:383f547ce4ddb8b243e5dc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const EXECS = [
        { name: "Ajiferuke Ridwanullahi", role: "President", key: "PREZ26-AJ" },
        { name: "Olaniyan Kehinde", role: "Vice President", key: "VP26-AR" },
        { name: "Executive 3", role: "Gen. Sec", key: "SEC26-SEC" },
        { name: "Executive 4", role: "Fin. Sec", key: "FIN26-FIN" },
        { name: "Executive 5", role: "Treasurer", key: "TRE26-TRE" },
        { name: "Executive 6", role: "P.R.O", key: "PRO26-PRO" },
        { name: "Executive 7", role: "Social Director", key: "SOC26-SOC" },
        { name: "Executive 8", role: "Sports Director", key: "SPT26-SPT" },
        { name: "Executive 9", role: "Welfare", key: "WEL26-WEL" },
        { name: "Executive 10", role: "Auditor", key: "AUD26-AUD" },
        { name: "Executive 11", role: "Provost", key: "PRV26-PRV" }
    ];

    let user = JSON.parse(localStorage.getItem('equity_v2'));

    window.onload = () => { if(user) showMainApp(); lucide.createIcons(); };

    function gate() {
        const k = prompt("Exec Key:");
        const f = EXECS.find(e => e.key === k);
        if(f) loginProcess(f.name, "EXEC-"+f.key, "no-email@exec.com", f.role);
    }

    function showForm() {
        document.getElementById('auth-ui').classList.add('hidden');
        document.getElementById('reg-form').classList.remove('hidden');
    }

    // UNIQUE REGISTRATION VALIDATION
    async function handleAuth() {
        const name = document.getElementById('reg-name').value.trim();
        const matric = document.getElementById('reg-matric').value.trim();
        const email = document.getElementById('reg-email').value.trim();

        if(!name || !matric || !email) return alert("Fill all fields");

        // Check if Matric or Email exists
        const checkMatric = await db.collection("users").where("matric", "==", matric).get();
        const checkEmail = await db.collection("users").where("email", "==", email).get();

        if(!checkMatric.empty || !checkEmail.empty) {
            // Check if it's the SAME person logging back in
            const existingUser = checkMatric.docs[0]?.data() || checkEmail.docs[0]?.data();
            if(existingUser.name !== name) {
                return alert("This Matric Number or Email is already registered to another name.");
            }
            // If it's the same person, allow them in (Login)
            loginProcess(existingUser.name, existingUser.matric, existingUser.email, existingUser.role);
        } else {
            // New Registration
            loginProcess(name, matric, email, "Student");
        }
    }

    async function loginProcess(name, matric, email, role) {
        user = { id: matric.replace(/\//g, '_'), name, matric, email, role, pic: `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}` };
        localStorage.setItem('equity_v2', JSON.stringify(user));
        await db.collection("users").doc(user.id).set(user, {merge: true});
        showMainApp();
    }

    function showMainApp() {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('main-nav').classList.remove('hidden');
        document.getElementById('u-pfp-top').src = user.pic;
        if(user.role !== "Student") document.getElementById('exec-tools').classList.remove('hidden');
        
        loadFeed();
        loadPolls();
    }

    // POLL SYSTEM
    async function createPoll() {
        const q = document.getElementById('poll-q').value;
        const o1 = document.getElementById('poll-o1').value;
        const o2 = document.getElementById('poll-o2').value;
        if(!q || !o1 || !o2) return;

        await db.collection("polls").add({
            q, options: [o1, o2], votes: {}, active: true, 
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Poll Live!");
    }

    function loadPolls() {
        db.collection("polls").where("active", "==", true).onSnapshot(snap => {
            const cont = document.getElementById('poll-display');
            cont.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                const total = Object.keys(d.votes || {}).length;
                cont.innerHTML += `
                    <div class="glass-card">
                        <p style="font-weight:800; font-size:0.9rem;">📊 ${d.q}</p>
                        ${d.options.map((opt, i) => `
                            <div class="poll-option" onclick="vote('${doc.id}', ${i})">
                                <span>${opt}</span>
                                <b>${Object.values(d.votes || {}).filter(v => v === i).length}</b>
                            </div>
                        `).join('')}
                        <small style="opacity:0.5; display:block; margin-top:10px;">Total Votes: ${total}</small>
                    </div>
                `;
            });
        });
    }

    async function vote(id, idx) {
        const ref = db.collection("polls").doc(id);
        const poll = (await ref.get()).data();
        if(poll.votes[user.id] !== undefined) return alert("Already voted!");
        
        const update = {}; update[`votes.${user.id}`] = idx;
        await ref.update(update);
    }

    function loadFeed() {
        db.collection("posts").orderBy("time", "desc").onSnapshot(snap => {
            const cont = document.getElementById('feed-display');
            cont.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                cont.innerHTML += `
                    <div class="glass-card">
                        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                            <img src="${d.pic}" style="width:30px; border-radius:50%;">
                            <h4 style="font-size:0.8rem;">${d.name} <span style="color:var(--deep-gold)">(${d.role})</span></h4>
                        </div>
                        <p>${d.txt}</p>
                    </div>`;
            });
        });
    }

    function switchTab(tab) {
        document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
        document.getElementById('tab-'+tab).classList.remove('hidden');
        if(tab === 'profile') {
            document.getElementById('p-img').src = user.pic;
            document.getElementById('p-name').innerText = user.name;
            document.getElementById('p-role').innerText = user.role;
        }
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>

</body>
</html>
